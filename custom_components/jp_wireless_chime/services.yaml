send_chime:
  name: Send chime
  description: Generate and send a Japanese wireless chime RF signal via a Broadlink remote entity.
  fields:
    protocol:
      name: Protocol
      description: Chime protocol to use.
      required: true
      selector:
        select:
          options:
            - revex_x
            - ohm_07
    channel:
      name: Channel
      description: Chime channel (OHM-07 requires 1-64 as number, Revex X requires format like "P16" where letter is A-P and number is 1-16. P16 is the factory default).
      required: true
      selector:
        text:
    melody:
      name: Melody
      description: Melody number.
      required: true
      selector:
        number:
          min: 1
          max: 64
          mode: box
    remote_entity_id:
      name: Broadlink remote entity
      description: Home Assistant remote entity used to transmit the generated RF code.
      required: true
      selector:
        entity:
          domain: remote
